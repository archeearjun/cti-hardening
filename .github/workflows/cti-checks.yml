name: CTI deterministic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit:extractor-changes
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - name: Probe public source definitions (diagnostic, no credentials)
        run: node tools/check-public-source-questions.mjs

  publish-pages-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deterministic, browser, access-configuration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cti-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forward verified main to the existing Cloudflare production branch
        run: |
          git fetch origin codex/typescript-pages-migration
          git merge-base --is-ancestor origin/codex/typescript-pages-migration HEAD
          git push origin HEAD:refs/heads/codex/typescript-pages-migration


  access-configuration:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/owner-only-cti')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production Access configuration before publishing
        run: node tools/check-pages-access-config.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify package scanning in Chromium
        run: npm run test:browser:package
      - name: Verify workspace workflow in Chromium
        run: npm run test:browser:workspace
      - name: Verify full responsive UX in Chromium
        run: npm run test:browser:ux
      - name: Verify actual extension item refresh in Chromium
        run: npm run test:browser:extension
      - name: Verify owner actions in Chromium
        run: npm run test:browser:owner
      - name: Verify assessment choice layout in Chromium
        run: npm run test:browser:choices
      - name: Verify isolated activity designer and capture reader
        run: npm run test:browser:activities
      - name: Verify owner-only CTI and colleague activity access
        run: node tools/browser-site-access-check.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cti-browser-screenshots
          if-no-files-found: ignore
          path: |
            /tmp/cti-ux-screenshots
            /tmp/cti-owner-actions
            /tmp/cti-extension-screenshots
            /tmp/cti-activity-screenshots
            /tmp/cti-site-access
